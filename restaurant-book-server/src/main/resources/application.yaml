server:
  port: 4201

spring:
  application:
    name: restaurant-book-server

  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: jdbc:postgresql://localhost:5435/restaurant_book
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

jwt:
  secret: ${JWT_SECRET:restaurant-book-dev-secret-key-must-be-at-least-32-bytes-long}
  # 키오스크/주방 단말은 매장 안 고정 디바이스라 1년으로 길게 설정
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:31536000000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:31536000000}
  issuer: restaurant-book

auth:
  signup:
    default-role: ${SIGNUP_DEFAULT_ROLE:ROLE_CUSTOMER}
  email-verification:
    code-ttl-seconds: 300
    verified-token-ttl-seconds: 600
    subject: RestaurantBook 이메일 인증코드
    from: ${MAIL_FROM:}
    log-only: ${AUTH_EMAIL_VERIFICATION_LOG_ONLY:true}
    dev-bypass-code: ${AUTH_EMAIL_VERIFICATION_DEV_BYPASS_CODE:1234}

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    bucket: ${AWS_S3_BUCKET_NAME:}
    region: ${AWS_S3_REGION:ap-northeast-2}
    prefix: ${AWS_S3_PREFIX:restaurant-book}
    presign-expires-seconds: 300

toss-payments:
  client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
  secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
  api-base-url: ${TOSS_PAYMENTS_API_BASE_URL:https://api.tosspayments.com}

app:
  seed:
    test-accounts:
      enabled: ${SEED_TEST_ACCOUNTS_ENABLED:true}
      password: ${SEED_TEST_ACCOUNTS_PASSWORD:password123}
      email-domain: ${SEED_TEST_ACCOUNTS_EMAIL_DOMAIN:restaurantbook.local}
    sale-menu:
      enabled: ${SEED_SALE_MENU_ENABLED:true}
    sale-menu-set:
      enabled: ${SEED_SALE_MENU_SET_ENABLED:true}
